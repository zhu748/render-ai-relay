services:
  - type: web
    name: render-ai-relay
    runtime: node
    plan: free
    autoDeployTrigger: "off"
    buildCommand: npm ci --omit=dev && npm run check
    startCommand: npm start
    healthCheckPath: /__proxy_health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: TARGET_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ADMIN_REQUEST_TIMEOUT_SECONDS
        value: "15"
      - key: HEARTBEAT_START_DELAY_SECONDS
        value: "1"
      - key: HEARTBEAT_INTERVAL_SECONDS
        value: "1"
      - key: KEEPALIVE_URL
        value: ""
      - key: KEEPALIVE_INTERVAL
        value: "60"
      - key: KEEPALIVE_TIMEOUT_SECONDS
        value: "30"
      - key: UPSTREAM_TIMEOUT_SECONDS
        value: "1800"
      - key: CONNECT_TIMEOUT_SECONDS
        value: "30"
      - key: TCP_KEEPALIVE_SECONDS
        value: "15"
      - key: UPSTREAM_IDLE_SOCKET_TIMEOUT_SECONDS
        value: "15"
      - key: DOWNSTREAM_STALL_TIMEOUT_SECONDS
        value: "120"
      - key: SHUTDOWN_GRACE_SECONDS
        value: "25"
      - key: MAX_CONCURRENT_REQUESTS
        value: "32"
      - key: MAX_JSON_DEPTH
        value: "1024"
      - key: MAX_BUFFERED_REQUEST_BYTES
        value: "67108864"
      - key: MAX_BUFFERED_RESPONSE_BYTES
        value: "536870912"
      - key: MAX_SSE_EVENT_BYTES
        value: "16777216"
      - key: MAX_BUFFERED_SSE_BYTES
        value: "67108864"
