name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Verify real HTTP heartbeat behavior
        run: npm run test:slow
        env:
          SMOKE_DELAY_SECONDS: '5'
      - name: Verify heartbeats inside a partial SSE event
        run: npm run test:slow
        env:
          SMOKE_DELAY_SECONDS: '5'
          SMOKE_RESPONSE_KIND: sse
